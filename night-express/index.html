<title>夜行列车</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one 16:9 stage (canvas film) on top, transport bar under it, clickable lyric sheet below. Single committed night look. */
:root{
  color-scheme: dark;
  --bg:#070914; --panel:#0e1126; --line:#232a52; --fg:#e8eaf8; --mute:#8f96c0;
  --lamp:#ffcf8a; --lamp-ink:#2a1a08; --dusk:#323a78; --chorus:#7a4d7a; --hover:#171b3a;
  --display:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--ui);padding-inline:16px;padding-block:0}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:18px;padding-block:22px 56px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px}
.top h1{margin:0;font:400 44px/1.1 var(--display);color:var(--lamp);letter-spacing:.04em}
.top p{margin:0;color:var(--mute);max-width:46ch;min-width:0}
.stage{position:relative;aspect-ratio:16/9;background:#02030a;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%}
.stage:fullscreen{border-radius:0;border:0;aspect-ratio:auto;display:grid;place-items:center}
.stage:fullscreen canvas{width:min(100vw,177.78vh);height:auto;aspect-ratio:16/9}
.veil{position:absolute;inset:0;width:100%;border:0;margin:0;padding:0;color:var(--fg);font:inherit;cursor:pointer;
  display:grid;place-content:end center;justify-items:center;gap:8px;padding-bottom:5%;
  background:linear-gradient(180deg,rgba(3,4,14,.05) 35%,rgba(3,4,14,.78))}
.veil[hidden]{display:none}
.veil .disc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--lamp);color:var(--lamp-ink);box-shadow:0 0 0 8px rgba(255,207,138,.18),0 10px 40px rgba(0,0,0,.5);transition:transform .2s}
.veil:hover .disc{transform:scale(1.06)}
.veil .t{font:500 20px/1.3 var(--serif);letter-spacing:.2em;margin-top:6px}
.veil .s{font-size:13px;color:var(--mute)}
.veil:focus-visible,.pp:focus-visible,.fsb:focus-visible,.ln:focus-visible,#seek:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.bar{display:flex;align-items:center;gap:12px;min-width:0}
.pp,.fsb{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.pp{background:var(--lamp);color:var(--lamp-ink)}
.fsb{background:var(--panel);color:var(--fg);border:1px solid var(--line);width:40px;height:40px}
.pp svg,.fsb svg{display:block}
.time{flex:none;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;min-width:5.6em;text-align:right}
#seek{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;margin:0;cursor:pointer;
  background:linear-gradient(90deg,rgba(255,207,138,.95) var(--p,0%),transparent var(--p,0%)),var(--track,var(--dusk))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--lamp);border:2px solid var(--bg)}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--lamp);border:2px solid var(--bg)}
.lyrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px 28px}
.sec{min-width:0}
.sec h3{margin:0 0 6px;font:500 12px/1.4 var(--ui);letter-spacing:.3em;color:var(--mute);text-transform:uppercase;padding-left:8px}
.sec.chorus h3{color:#d9a6d2}
.ln{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;
  font:500 17px/1.5 var(--serif);color:#9ba3cf}
.ln:hover{background:var(--hover);color:var(--fg)}
.ln.on{background:var(--hover);color:var(--lamp)}
.ln.inst{font-style:normal;color:var(--mute);font-size:14px}
.hint{margin:0;padding:8px 12px;border-radius:8px;background:var(--hover);border:1px solid var(--line);color:var(--lamp);font-size:14px}
.hint[hidden]{display:none}
.note{margin:0;color:var(--mute);font-size:13px;max-width:70ch}
@media (max-width:560px){.top h1{font-size:36px}.time{min-width:0;font-size:12px}.bar{gap:8px}}
@media (prefers-reduced-motion:reduce){.veil .disc{transition:none}}
</style>

<main class="wrap">
  <header class="top">
    <h1>夜行列车</h1>
    <p>一首原创小曲。旋律、鼓点和画面都在浏览器里现场生成，每个字、每一拍都对得上。请打开声音。</p>
  </header>

  <section class="stage" id="stage" aria-label="动画播放区">
    <canvas id="cv" role="img" aria-label="夜行列车动画：一列夜车从熄灯的城市出发，穿过原野，在日出时抵达"></canvas>
    <button class="veil" id="veil" type="button">
      <span class="disc"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
      <span class="t" id="veilT">点击播放</span>
      <span class="s" id="veilS">约 1 分 43 秒 · 戴耳机更好</span>
    </button>
  </section>

  <p class="hint" id="hint" hidden role="status">还没听到声音？请确认没有开静音（手机侧面的静音拨片也要关），音量调高，然后点一下画面暂停再播放。</p>
  <div class="bar">
    <button class="pp" id="pp" type="button" aria-label="播放"></button>
    <input id="seek" type="range" min="0" max="1000" step="2" value="0" aria-label="播放进度">
    <span class="time" id="tm">0:00 / 1:43</span>
    <button class="fsb" id="fs" type="button" aria-label="全屏"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <section class="lyrics" id="lyr" aria-label="歌词，点击一句可以跳转"></section>

  <p class="note">声音全部由 Web Audio 合成：96 BPM，Am–F–C–G 循环，没有真人演唱。旋律由合成器按歌词逐字演奏，字幕跟着音符一个字一个字点亮。画面由同一个音频时钟驱动，所以鼓点、歌词和动画不会漂移。</p>
</main>

<script>
(()=>{
'use strict';
/* ========================================================================
   常量与工具
   ======================================================================== */
const W=1280,H=720,GY=556,TAU=Math.PI*2;
const BPM=96,BEAT=60/BPM,EIGHTH=BEAT/2,BAR=BEAT*4,BARS=40;
const MUSIC_END=BARS*BAR, END=MUSIC_END+2.6, V=520;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const u=clamp((x-a)/(b-a));return u*u*(3-2*u)};
const mix3=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t];
const rgb=(a,al=1)=>'rgba('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+','+al+')';
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const hash2=(a,b)=>hash(a*57.13+b*13.7+1.7);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ========================================================================
   乐谱：和弦、段落、歌词（每个字对应一个音符）
   ======================================================================== */
const CH={Am:{root:45,n:[57,60,64]},F:{root:41,n:[57,60,65]},C:{root:48,n:[55,60,64]},G:{root:43,n:[55,59,62]}};
const PROG=[
  'Am','F','C','G',
  'Am','F','C','G','Am','F','C','G',
  'F','C','G','Am','F','C','G','Am',
  'Am','F','C','G','Am','F','C','G',
  'F','C','G','Am','F','C','G','Am',
  'Am','F','C','Am'];
const SECS=[
  {k:'intro',n:'前奏',bar:0,len:4},{k:'verse',n:'主歌',bar:4,len:8},{k:'chorus',n:'副歌',bar:12,len:8},
  {k:'verse',n:'主歌',bar:20,len:8},{k:'chorus',n:'副歌',bar:28,len:8},{k:'outro',n:'尾声',bar:36,len:4}];
const secOfBar=b=>SECS.findIndex(s=>b>=s.bar&&b<s.bar+s.len);
// 每句占两小节，数字是以八分音符计的字长
const RH={a:[2,2,2,2,2,2,2,2],b:[1,1,2,2,2,2,2,4],c:[2,2,2,2,2,2,4],d:[1,1,2,2,1,1,2,2,4],e:[1,1,1,1,2,2,2,2,1,3],f:[2,2,4,2,2,4]};
const M_C1=[77,77,81,77,79,81,79,76,79,72],M_C2=[74,76,79,76,72,74,76,69],M_C3=[77,77,81,77,79,81,76,79,84],M_C4=[74,76,79,79,83,81,76,81];
const M_V4=[76,79,76,74,72,74,71,67];
const RAW=[
  [4,'城市的灯慢慢熄灭','b',[76,76,72,74,76,77,76,72]],
  [6,'列车载着我向前','c',[79,76,72,74,71,74,79]],
  [8,'窗外的星星在眨眼','a',[72,76,74,72,77,76,72,69]],
  [10,'像在说不要回头看','b',M_V4],
  [12,'夜行列车带我穿过黑夜','e',M_C1],
  [14,'天亮之前别说再见','a',M_C2],
  [16,'轰隆隆的节拍像心跳','d',M_C3],
  [18,'把所有的梦都点燃','b',M_C4],
  [20,'田野在窗外慢慢后退','d',[76,76,72,74,76,74,77,76,72]],
  [22,'月亮跟着我走了很远','d',[79,76,72,74,76,79,74,71,79]],
  [24,'有人在远方点亮了灯','d',[72,76,74,72,76,77,77,76,72]],
  [26,'告诉我黎明已不远','b',M_V4],
  [28,'夜行列车带我穿过黑夜','e',M_C1],
  [30,'天亮之前别说再见','a',M_C2],
  [32,'轰隆隆的节拍像心跳','d',M_C3],
  [34,'把整个世界都点燃','b',M_C4],
  [36,'天亮了 天亮了','f',[81,76,72,81,77,72]],
  [38,'谢谢你陪我到终点','b',[79,79,76,74,72,76,72,69]]];
const LINES=[],LYEV=[];
RAW.forEach(([bar,text,rk,notes],li)=>{
  const t0=bar*BAR,rh=RH[rk];let e=0,k=0;const chars=[],evs=[];
  for(const ch of text){
    if(ch===' '){chars.push({gap:true,ch});continue}
    const ev={li,ci:chars.length,k,ch,t:t0+e*EIGHTH,d:rh[k]*EIGHTH,midi:notes[k]};
    chars.push(ev);evs.push(ev);LYEV.push(ev);e+=rh[k];k++;
  }
  const last=evs[evs.length-1],si=secOfBar(bar);
  LINES.push({li,text,bar,t0,t1:last.t+last.d,chars,evs,si,chorus:SECS[si].k==='chorus',outro:SECS[si].k==='outro'});
});
const OFFT=LINES[0].evs.map(e=>e.t);   // “灯慢慢熄灭”：每个字熄一批窗

/* ========================================================================
   音频事件表（以秒计，相对歌曲起点）
   ======================================================================== */
const EV=[];
const ev=(t,type,o)=>EV.push(Object.assign({t:Math.max(0,t),type},o));
for(let bar=0;bar<BARS;bar++){
  const si=secOfBar(bar),S=SECS[si],k=S.k,b=bar-S.bar,ch=CH[PROG[bar]],T=bar*BAR,e8=i=>T+i*EIGHTH,last=bar===BARS-1;
  ev(T-0.04,'pad',{notes:ch.n,dur:BAR+0.1+(last?2.4:0),v:k==='chorus'?1:0.8,bright:k==='chorus'});
  if(k==='chorus') [[0,1,0],[1,1,0],[2,1,12],[3,1,0],[4,1,0],[5,1,0],[6,1,12],[7,1,0]].forEach(([i,l,o])=>ev(e8(i),'bass',{m:ch.root+o,d:l*EIGHTH*0.9,v:0.6}));
  else if(k==='verse') [[0,3,0],[3,1,0],[4,2,0],[6,2,7]].forEach(([i,l,o])=>ev(e8(i),'bass',{m:ch.root+o,d:l*EIGHTH*0.92,v:0.62}));
  else if((k==='intro'&&b>=2)||(k==='outro'&&b<3)) ev(T,'bass',{m:ch.root,d:BAR*0.95,v:0.5});
  const pat=k==='chorus'?[0,2,1,2,0,2,1,2]:[0,1,2,1,0,1,2,1], av={intro:0.55,verse:0.32,chorus:0.42,outro:0.42}[k];
  for(let i=0;i<8;i++){ if(last&&i>=4) break; ev(e8(i),'pluck',{m:ch.n[pat[i]]+12,d:0.5,v:av*(i%2?0.8:1)}); }
  const roll=ps=>ps.forEach((p,i)=>ev(T+p*EIGHTH/2,'snare',{v:0.22+0.5*i/(ps.length-1)}));
  const hat=(i,v,open)=>ev(e8(i),'hat',{v,open:!!open});
  if(k==='intro'){
    if(b>=2){[0,2,4,6].forEach(i=>hat(i,0.07));ev(T,'kick',{v:0.8});}
    if(b===3){ev(e8(4),'kick',{v:0.8});roll([8,10,12,13,14,15]);}
  }else if(k==='verse'){
    ((b%2)?[0,3,4,6]:[0,4]).forEach(i=>ev(e8(i),'kick',{v:0.85}));
    if(b<7)[2,6].forEach(i=>ev(e8(i),'snare',{v:0.3}));else roll([0,4,8,10,12,13,14,15]);
    for(let i=0;i<8;i++)hat(i,i%2?0.07:0.04);
    if(b===0)ev(T,'crash',{v:0.45});
  }else if(k==='chorus'){
    [0,2,4,6].forEach(i=>ev(e8(i),'kick',{v:0.95}));
    [2,6].forEach(i=>{ev(e8(i),'snare',{v:0.5});ev(e8(i),'clap',{v:0.5})});
    for(let i=0;i<8;i++)hat(i,i%2?0.1:0.06,i===3||i===7);
    if(b===0)ev(T,'crash',{v:0.8});
  }else if(k==='outro'&&b===0){ev(T,'kick',{v:0.7});ev(T,'crash',{v:0.4});}
  if(bar===2||bar===10||bar===26)ev(T,'riser',{dur:2*BAR,v:bar===2?0.6:1});
  if(last)[81,84,88,93].forEach((m,i)=>ev(e8(4+i),'pluck',{m,d:2.4,v:0.5}));
}
LYEV.forEach(e=>{
  const ch=LINES[e.li].chorus;
  ev(e.t,'lead',{m:e.midi,d:e.d*0.94,v:ch?1:0.85});
  if(ch)ev(e.t,'lead',{m:e.midi-12,d:e.d*0.94,v:0.35});
});
EV.sort((a,b)=>a.t-b.t);

/* ========================================================================
   合成器
   ======================================================================== */
let ctx=null,master,ana,rvIn,dlIn,NB,FD=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function setupGraph(ac){
  ctx=ac;
  master=ac.createGain();master.gain.value=0.62;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=18;comp.ratio.value=3.5;comp.attack.value=0.006;comp.release.value=0.22;
  master.connect(comp);
  if(ac.createAnalyser){ana=ac.createAnalyser();ana.fftSize=256;ana.smoothingTimeConstant=0.78;comp.connect(ana);ana.connect(ac.destination);FD=new Uint8Array(ana.frequencyBinCount);}
  else comp.connect(ac.destination);
  // 混响
  const len=Math.floor(ac.sampleRate*2.4),ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  rvIn=ac.createConvolver();rvIn.buffer=ir;const rvOut=ac.createGain();rvOut.gain.value=0.5;rvIn.connect(rvOut);rvOut.connect(master);
  // 回声（附点八分）
  dlIn=ac.createGain();const dl=ac.createDelay(2),fb=ac.createGain(),lp=ac.createBiquadFilter(),dOut=ac.createGain();
  dl.delayTime.value=BEAT*0.75;fb.gain.value=0.36;lp.type='lowpass';lp.frequency.value=2400;dOut.gain.value=0.5;
  dlIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(dOut);dOut.connect(master);
  // 噪声
  NB=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
function mkSession(){
  const dry=ctx.createGain(),rv=ctx.createGain(),dl=ctx.createGain();
  dry.connect(master);rv.connect(rvIn);dl.connect(dlIn);return{dry,rv,dl};
}
function killSession(S){
  const n=ctx.currentTime;
  [S.dry,S.rv,S.dl].forEach(g=>{g.gain.cancelScheduledValues(n);g.gain.setTargetAtTime(0,n,0.02)});
  setTimeout(()=>{try{S.dry.disconnect();S.rv.disconnect();S.dl.disconnect()}catch(e){}},500);
}
function conn(node,S,rv,dl){
  node.connect(S.dry);
  if(rv){const g=ctx.createGain();g.gain.value=rv;node.connect(g);g.connect(S.rv)}
  if(dl){const g=ctx.createGain();g.gain.value=dl;node.connect(g);g.connect(S.dl)}
}
function noise(w,dur,loop){const s=ctx.createBufferSource();s.buffer=NB;s.loop=!!loop;s.start(w,loop?0:Math.random()*0.9);s.stop(w+dur);return s}
const osc=(type,f)=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f;return o};
const vKick=(w,v,S)=>{const o=osc('sine',155),g=ctx.createGain();o.frequency.setValueAtTime(155,w);o.frequency.exponentialRampToValueAtTime(46,w+0.13);
  g.gain.setValueAtTime(0.0001,w);g.gain.linearRampToValueAtTime(v,w+0.004);g.gain.exponentialRampToValueAtTime(0.0001,w+0.42);o.connect(g);conn(g,S);o.start(w);o.stop(w+0.45)};
const vSnare=(w,v,S)=>{const n=noise(w,0.25),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=1700;
  g.gain.setValueAtTime(v*0.8,w);g.gain.exponentialRampToValueAtTime(0.0001,w+0.2);n.connect(f);f.connect(g);conn(g,S,0.18);
  const o=osc('triangle',220),g2=ctx.createGain();o.frequency.setValueAtTime(220,w);o.frequency.exponentialRampToValueAtTime(140,w+0.08);
  g2.gain.setValueAtTime(v*0.6,w);g2.gain.exponentialRampToValueAtTime(0.0001,w+0.12);o.connect(g2);conn(g2,S);o.start(w);o.stop(w+0.14)};
const vClap=(w,v,S)=>{for(let i=0;i<3;i++){const t=w+i*0.011,n=noise(t,0.2),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.frequency.value=1500;f.Q.value=0.9;
  g.gain.setValueAtTime(v*(i<2?0.5:0.9),t);g.gain.exponentialRampToValueAtTime(0.0001,t+(i<2?0.02:0.16));n.connect(f);f.connect(g);conn(g,S,i===2?0.3:0)}};
const vHat=(w,v,open,S)=>{const d=open?0.16:0.045,n=noise(w,d+0.02),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=7500;
  g.gain.setValueAtTime(v,w);g.gain.exponentialRampToValueAtTime(0.0001,w+d);n.connect(f);f.connect(g);conn(g,S,open?0.1:0)};
const vCrash=(w,v,S)=>{const n=noise(w,1.8),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=4500;
  g.gain.setValueAtTime(v*0.4,w);g.gain.exponentialRampToValueAtTime(0.0001,w+1.6);n.connect(f);f.connect(g);conn(g,S,0.4)};

let playingNow=false;
function frame(t){
  const oldT=prevT,dt=clamp(t-prevT,0,0.08);
  if(t<prevT-0.001||t-prevT>0.6){PT.length=0;SP.length=0;lastBi=Math.floor(t/BEAT)}
  else if(oldT>=0&&dt>0)spawnSparks(oldT,t);
  prevT=t;
  const pal=palAt(t),en=energyAt(t),bph=t/BEAT,bp=bph-Math.floor(bph);
  const kick=Math.exp(-bp*5.2)*en,spd=speedAt(t),dist=distAt(t);
  const dawn=sstep(54,80,t),day=sstep(76,94,t),nightA=1-sstep(54,76,t);
  const chA=(sstep(29.4,31,t)-sstep(50,51.5,t))+(sstep(69.4,71,t)-sstep(90,91.5,t));
  const bi=Math.floor(bph);
  if(bi!==lastBi){if(bi===lastBi+1&&dt>0)spawnBeat(pal,spd,en);lastBi=bi}
  stepParticles(dt);
  const col=d=>rgb(mix3(pal.bot,pal.shade,d));

  c.setTransform(scale,0,0,scale,0,0);c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.save();
  const hi=en>0.8?1:0.35,z=1.016+(RM?0:0.010*kick*hi);
  const shx=RM?0:Math.sin(t*37)*kick*1.6*hi,shy=RM?0:Math.cos(t*29)*kick*1.2*hi;
  c.translate(W/2+shx,H*0.62+shy);c.scale(z,z);c.translate(-W/2,-H*0.62);

  drawSky(pal,t,dawn);
  drawStars(t,dist,kick,chA,nightA);
  const aur=(sstep(30,34,t)-sstep(50,54,t));drawAurora(t,aur*(0.85+0.3*kick));
  drawClouds(pal,t,dist);
  drawMoon(pal,t,kick,Math.max(evPulse(3,t,4),evPulse(9,t,4)));
  drawSun(pal,t,kick,Math.max(evPulse(12,t,3),evPulse(13,t,3),evPulse(16,t,3)));
  fxSky(t,pal);
  drawMountains(col(0.25),dist*0.03);
  // 城市灯光的光晕
  const litN=OFFT.filter(x=>x<=t).length,litFrac=t<OFFT[0]?1:1-litN/8*0.9;
  if(litFrac>0.02&&nightA>0.02){
    c.save();c.globalCompositeOperation='lighter';const gx=830-dist*0.35,g=c.createRadialGradient(gx,480,10,gx,480,560);
    g.addColorStop(0,'rgba(255,190,110,'+(0.22*litFrac*nightA)+')');g.addColorStop(1,'rgba(255,190,110,0)');c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
  }
  drawCity(CITY.f0,dist*0.12,478,col(0.38),true,pal,t,day,bp);
  drawCity(CITY.f1,dist*0.12,478,col(0.38),true,pal,t,day,bp);
  drawHills(col(0.5),dist*0.2,500,50,4.2);
  drawBeacons(t,dist*0.2,500,50,4.2);
  drawCity(CITY.n0,dist*0.35,540,col(0.66),false,pal,t,day,bp);
  drawCity(CITY.n1,dist*0.35,540,col(0.66),false,pal,t,day,bp);
  drawTrees(dist*0.55,548,col(0.8));
  drawGround(pal,dist,t,spd,col);
  drawPoles(dist,col(0.9),pal);
  drawFireflies(t,dist,kick);
  drawBeam(t,spd,day,kick,Math.max(evPulse(4,t,3),evPulse(12,t,3)));
  drawTrain(t,pal,spd,dist,kick,day);
  drawSmoke(pal);
  drawBank(pal,dist);
  drawFgPoles(dist,spd,pal);
  fxFront(t,pal);
  drawSpeedLines(t,chA,spd);
  if(!RM){
    glowFlash([255,170,230],0.14*Math.exp(-(t-30)*3)*(t>=30&&t<33?1:0));
    glowFlash([255,200,150],0.14*Math.exp(-(t-70)*3)*(t>=70&&t<73?1:0));
    glowFlash([255,246,214],0.34*Math.exp(-(t-85)*2.2)*(t>=85&&t<88?1:0));
  }
  c.restore();

  // 暗角与字幕底
  if(!vig){vig=c.createRadialGradient(W/2,H*0.5,H*0.35,W/2,H*0.5,H*1.0);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.5)')}
  c.fillStyle=vig;c.fillRect(0,0,W,H);
  const sc=c.createLinearGradient(0,H*0.78,0,H);sc.addColorStop(0,'rgba(0,0,0,0)');sc.addColorStop(1,'rgba(0,0,0,0.38)');c.fillStyle=sc;c.fillRect(0,H*0.78,W,H*0.22);
  drawLyrics(t);drawSparks();drawTitle(t,kick,pal);
}

function initAudio(){
  unlockMobileAudio();
  const AC=window.AudioContext||window.webkitAudioContext;
  setupGraph(new AC({latencyHint:'interactive'}));
  pump=setInterval(()=>{
    if(!ctx||!session||!playing)return;
    const now=ctx.currentTime,hor=now+0.4;
    while(evIdx<EV.length){
      const e=EV[evIdx],w=t0+e.t;if(w>hor)break;evIdx++;
      if(w<now-0.05)continue;trigger(e,Math.max(w,now),session);
    }
  },50);
}
function startSession(pos){
  if(session)killSession(session);
  session=mkSession();
  t0=ctx.currentTime+0.15-pos;
  evIdx=EV.findIndex(e=>e.t>=pos-0.001);if(evIdx<0)evIdx=EV.length;
  for(const e of EV){ // 正在持续的和弦垫，从当前位置接上
    if(e.type==='pad'&&e.t<pos&&e.t+e.dur>pos+0.4)trigger(Object.assign({},e,{dur:e.t+e.dur-pos}),ctx.currentTime+0.15,session);
  }
}
async function startPlay(pos){
  if(!ctx)initAudio();
  try{await ctx.resume()}catch(e){}
  startSession(pos||0);started=true;playing=true;ended=false;playingNow=true;startedAt=performance.now();ui();
}
function curT(){
  if(!started)return 3+((performance.now()/1000)%4.8);
  if(pendingSeek!==null)return pendingSeek;
  if(ended)return END;
  return clamp(ctx.currentTime-t0-(ctx.outputLatency||0),0,END);
}
async function toggle(){
  if(!started||ended){await startPlay(0);return}
  if(playing){await ctx.suspend();playing=false;playingNow=false;if(keepAlive)keepAlive.pause()}
  else{unlockMobileAudio();await ctx.resume();playing=true;playingNow=true}
  ui();
}
function seek(pos){
  pos=clamp(pos,0,END-0.6);
  if(!started){startPlay(pos);return}
  pendingSeek=pos;
  if(session){killSession(session);session=null}
  clearTimeout(seekTimer);
  seekTimer=setTimeout(async()=>{
    pendingSeek=null;
    if(ended||!playing){ended=false;playing=true;playingNow=true;try{await ctx.resume()}catch(e){}}
    startSession(pos);ui();
  },140);
}
function ui(){
  pp.innerHTML=playing?ICON_PAUSE:ICON_PLAY;pp.setAttribute('aria-label',playing?'暂停':'播放');
  veil.hidden=started&&!ended;

}

function loop(now){
  const t=window.__freeze!=null?window.__freeze:curT();
  if(started&&playing&&!ended&&pendingSeek===null&&t>=END-0.001){ended=true;playing=false;playingNow=false;try{ctx.suspend()}catch(e){}ui()}

window.__mv={frame,END,LINES,EV,dbg:()=>({state:ctx&&ctx.state,ct:ctx&&ctx.currentTime,t0,evIdx,started,playing,ended,fd:FD?Math.max.apply(null,FD):-1,sess:!!session}),
  async renderOffline(){
    const sr=44100,oc=new OfflineAudioContext(2,Math.ceil(sr*(END+1)),sr),saved=[ctx,master,ana,rvIn,dlIn,NB,FD];
    setupGraph(oc);const S=mkSession();EV.forEach(e=>trigger(e,e.t+0.05,S));
    const buf=await oc.startRendering();[ctx,master,ana,rvIn,dlIn,NB,FD]=saved;
    const L=buf.getChannelData(0),R=buf.getChannelData(1),out=[];
    for(let s=0;s<Math.ceil(END);s+=5){let pk=0,sum=0,n=0;for(let i=Math.floor(s*sr);i<Math.min(L.length,Math.floor((s+5)*sr));i++){const v=Math.max(Math.abs(L[i]),Math.abs(R[i]));if(v>pk)pk=v;sum+=L[i]*L[i];n++}out.push({s,peak:+pk.toFixed(3),rms:+Math.sqrt(sum/n).toFixed(4)})}
    let nan=0;for(let i=0;i<L.length;i+=97)if(!isFinite(L[i]))nan++;
    return{out,nan,len:L.length/sr};
  }};
